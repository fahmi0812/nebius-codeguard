[project]
name = "nebius-codeguard"
version = "0.1.0"
description = "Coding agent with quality/security gates on Nebius Token Factory Sandboxes + NVIDIA Nemotron"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fahmi Harun" }]
dependencies = [
  "contree-sdk>=0.3.6",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
codeguard = "codeguard.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits Nebius Token Factory Sandboxes (needs NEBIUS_API_KEY + NEBIUS_PROJECT_ID)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]  # typer.Argument/Option defaults are idiomatic
